schema: spec-driven

context: |
  Project: personal, local-first project and work tracker: goals (with
  measures tracking their progress), projects, tasks, habits and work done,
  with focus sessions and a guided weekly review.
  Single user. The full product spec is in docs/SPEC.md; read the relevant
  sections before writing any artifact. The app is being rebuilt: specs in
  openspec/specs/ that describe the previous app are the brief for the
  rebuild, not current code.

  Tech stack:
  - Tauri 2 desktop app (Linux), main target, works fully offline; the same
    React + TypeScript frontend (Vite) also runs as a browser build.
    Android companion (tasks + time tracking) comes later.
  - Desktop-only features (tray, hotkey, notifications, native SQLite) sit
    behind src/platform/; feature code never checks the platform itself,
    and the browser build must start without Tauri APIs.
  - Database: Drizzle (sqlite-proxy) over the drivers in src/platform/db
    (Rust/rusqlite on desktop, sqlite-wasm OPFS worker in the browser,
    node:sqlite in tests). Schema in src/core/db/schema.ts, migrations in
    drizzle/ via npm run db:generate (never edit applied ones). Use
    db.batch() for writes that belong together; no foreign keys; tests use
    openTestDatabase().
  - Sync server in server/: Cloudflare Worker + D1, last-write-wins per
    row, bearer token per device, also serves the browser build. Server
    tables come from the app schema (npm run db:generate:server after a
    schema change). The app side of sync is a later change (sync-client).

  Architecture conventions:
  - Feature-first folders: src/core/ (shared), src/features/<feature>/
    (data/, domain/, ui/), src/platform/ (platform adapters)
  - UI never talks to the database directly; it goes through repositories
  - Every synced table has: id (UUID v4, generated on client),
    created_at, updated_at (UTC), deleted_at (nullable, soft delete).
    Queries exclude soft-deleted rows by default.
  - Pure business logic (scores, ranks, deadlines, habit due rules) lives
    in domain/ as plain TypeScript functions with Vitest tests, no React
  - Dates: store timestamps in UTC; habit and review dates are local
    calendar dates; weeks start on Monday
  - Fonts and images are bundled (assets/), never loaded from the network

  UI conventions (redefined in the app-shell change):
  - Desktop first; layouts must also work in a browser window
  - Leave unset values out; no placeholder texts like "No area" or
    "No deadline" (choices in pickers are fine)
  - Empty lists and sections: an icon, one short line without a period,
    and the action that fills it
  - Respect reduced motion

  Quality:
  - npm run check (strict tsc, ESLint, Vitest) must pass
  - Unit tests for all domain logic and repositories
  - Keep dependencies minimal; justify each new package in design.md

rules:
  proposal:
    - Reference the relevant sections of docs/SPEC.md
    - Keep the change small (about 5 delta specs and 15 tasks at most); if it is bigger, split it into several changes and propose them one at a time
    - State explicitly what is out of scope for this change
  specs:
    - Use WHEN/THEN scenarios that can be turned into tests
    - Keep requirements small and focused, so a MODIFIED delta copies little text
  design:
    - Write a design only for real decisions (schema, migrations, architecture); skip it for UI-only changes and keep it short
    - List new packages with a one-line justification
    - Describe database schema changes and migrations explicitly
  tasks:
    - Keep tasks small enough to verify individually
    - Name the files each task touches
    - Include tasks for tests and for running npm run check
    - Test each spec scenario once, at the lowest level that shows it; no tests for layout order, framework behavior or trivial getters
    - Include a task to verify the change in the desktop app and in the browser