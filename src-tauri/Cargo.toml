[package]
name = "orbit"
version = "0.1.0"
description = "Orbit desktop app"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41", features = ["bundled"] }
notify-rust = "4.18.2"
