[package]
name = "orbit"
version = "1.0.0"
description = "Orbit desktop app"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41", features = ["bundled"] }

# Tray and desktop notifications: desktop only (they do not build for Android).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
notify-rust = "4.18.2"
