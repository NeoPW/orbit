<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Orbit: projects, tasks, habits, focused work and a weekly review." />
    <link rel="icon" type="image/png" href="/assets/icon/orbit.png" />
    <title>Orbit</title>
    <script>
      // Sets the colour theme before React starts, from the mirror of the theme setting.
      try {
        var grounds = { slate: '#0f1218', forest: '#0e1512', ember: '#15110e', plum: '#140f1a', graphite: '#111112' };
        var theme = localStorage.getItem('orbit-theme');
        if (grounds[theme]) {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.background = grounds[theme];
        }
      } catch (e) {}
    </script>
    <style>
      /* Loading screen: shown until React replaces the content of #root. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        background: #0f1218;
      }
      .boot {
        height: 100%;
        display: grid;
        place-items: center;
      }
      .boot img {
        width: 112px;
        height: 112px;
        border-radius: 24px;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/assets/icon/orbit.png" alt="Orbit is loading" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
