<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbit: projects, tasks, habits, focused work and a weekly review." />
    <link rel="icon" type="image/png" href="/assets/icon/orbit.png" />
    <title>Orbit</title>
    <style>
      /* Loading screen: shown until React replaces the content of #root. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1026;
      }
      .boot {
        height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%),
          radial-gradient(1px 1px at 70% 20%, #fff6 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 85% 65%, #fff7 50%, transparent 51%),
          radial-gradient(1px 1px at 35% 80%, #fff5 50%, transparent 51%),
          radial-gradient(1px 1px at 55% 50%, #fff4 50%, transparent 51%),
          radial-gradient(ellipse at 50% 40%, #1a2350 0%, #0b1026 70%);
      }
      .boot img {
        width: 112px;
        height: 112px;
        border-radius: 24px;
        filter: drop-shadow(0 0 32px #8b8cff55);
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/assets/icon/orbit.png" alt="Orbit is loading" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
